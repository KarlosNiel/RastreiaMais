<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="rc-orange" x1="2" y1="4" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FB923C" />
      <stop offset="45%" stopColor="#F97316" />
      <stop offset="100%" stopColor="#EA580C" />
    </linearGradient>
    <linearGradient id="rc-ribbon" x1="4" y1="6" x2="16" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FDBA74" />
      <stop offset="35%" stopColor="#FB923C" />
      <stop offset="100%" stopColor="#EA580C" />
    </linearGradient>
  </defs>

  <!-- Lado Esquerdo do Coração: Curva dinâmica / Faixa de Cuidado -->
  <path
    d="M15.5 8.2C13.8 6.2 10.8 5 8 5C4.2 5 2 7.8 2 12C2 17.5 7.5 22.8 15.5 28C15.8 28.2 16.2 28.2 16.5 28C14.5 25.5 11 21.8 10 18.5C9.2 15.8 9.5 13.5 10.8 11.5C11.8 9.8 13.5 8.8 15.5 8.2Z"
    fill="url(#rc-ribbon)"
  />

  <!-- Rede de Monitoramento / Nodos Conectados (Lado Direito) -->
  <g stroke="url(#rc-orange)" stroke-width="0.8" opacity="0.85">
    <line x1="25.5" y1="6.5" x2="20.5" y2="10.5" />
    <line x1="25.5" y1="6.5" x2="28.5" y2="14" />
    <line x1="20.5" y1="10.5" x2="28.5" y2="14" />
    <line x1="20.5" y1="10.5" x2="24" y2="19.5" />
    <line x1="28.5" y1="14" x2="24" y2="19.5" />
    <line x1="24" y1="19.5" x2="19" y2="24" />
    <line x1="28.5" y1="14" x2="22" y2="26" stroke-dasharray="1.2 1" />
  </g>

  <!-- Arco Externo da Rede Direita -->
  <path
    d="M15.5 8.2C17.5 6 21.5 5 25.5 6.5C28 7.5 30 10.5 30 13.5C30 17 28 20.5 24 24C20.5 27 17.5 28.5 16 29"
    stroke="url(#rc-orange)"
    stroke-width="1.2"
    stroke-linecap="round"
    stroke-dasharray="28"
    stroke-dashoffset="0"
    opacity="0.9"
  />

  <!-- Nodos da Rede de Saúde Digital -->
  <circle cx="25.5" cy="6.5" r="1.6" fill="url(#rc-orange)" />
  <circle cx="20.5" cy="10.5" r="1.3" fill="url(#rc-orange)" />
  <circle cx="28.5" cy="14" r="1.4" fill="url(#rc-orange)" />
  <circle cx="24" cy="19.5" r="1.3" fill="url(#rc-orange)" />
  <circle cx="19" cy="24" r="1.2" fill="url(#rc-orange)" />

  <!-- Pulso / Eletrocardiograma (ECG Rastreamento Ativo) -->
  <path
    d="M1 18H8.5L10 16.5L12 21L14.5 9L17.5 23L19.5 16L21 18H25"
    stroke="url(#rc-orange)"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
